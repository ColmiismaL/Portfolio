name: Deploy Portfolio

# main에 코드가 올라오면 실행. Actions 화면에서 수동 실행도 가능.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 저장소 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v7

      # 프로젝트에 필요한 Node.js 준비
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # 의존성 설치 및 배포용 파일 생성
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base=/Portfolio/

      # 완성된 dist 폴더를 Pages에 배포
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
